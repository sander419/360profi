# nginx для 360PROFI: статика фронта и проксирование API на localhost:4000.
# Фронт и API на одном домене — тогда QR-ссылки, вход и запросы живут в одном
# источнике, и CORS не нужен вовсе.
#
# Положить в /etc/nginx/sites-available/360profi, включить симлинком,
# TLS выпустить certbot'ом: certbot --nginx -d sklad.example.ru

server {
    listen 80;
    listen [::]:80;
    server_name sklad.example.ru;

    # certbot заменит этот блок на редирект и добавит 443-й server.
    root /var/www/360profi;
    index index.html;

    access_log /var/log/nginx/360profi.access.log;
    error_log  /var/log/nginx/360profi.error.log;

    client_max_body_size 2m;

    # Приложение: маршруты живут в хеше, поэтому серверу достаточно index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хешированные ассеты Vite можно кешировать надолго, index.html — никогда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Заголовки безопасности: приложение не должно открываться в чужом фрейме,
    # а браузер — угадывать типы файлов.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}
